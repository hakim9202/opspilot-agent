{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opspilot-agent.fullname" . }}
  labels:
    {{- include "opspilot-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Allowlisted remediations (set memory / set image) after user confirm in SaaS.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
  # Optional live CPU/memory via metrics-server (ignored if API absent).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opspilot-agent.fullname" . }}
  labels:
    {{- include "opspilot-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opspilot-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opspilot-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
