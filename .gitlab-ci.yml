stages:
  - build

variables:
  IMAGE_NAME: opspilot-agent
  DOCKER_BUILD_ARCH: amd64
  # Defaults match intt-portal / inttdev Harbor (override in CI/CD settings if needed)
  HARBOR_HOST: harbor-tkg.dev.kubix.tm.com.my
  HARBOR_PROJECT: inttdev
  HARBOR_URL: "https://harbor-tkg.dev.kubix.tm.com.my"

# Build + push to harbor-tkg.dev.kubix.tm.com.my/inttdev/opspilot-agent
# Group iNTT provides HARBOR_USERNAME_DEV + HARBOR_PASSWORD_DEV.
build-harbor:
  stage: build
  environment:
    name: staging
  script:
    - |
      export HARBOR_USER="${HARBOR_USERNAME:-$HARBOR_USERNAME_DEV}"
      export HARBOR_PASS="${HARBOR_PASSWORD:-$HARBOR_PASSWORD_DEV}"
      if [ -z "${HARBOR_HOST}" ] || [ -z "${HARBOR_PROJECT}" ]; then
        echo "HARBOR_HOST and HARBOR_PROJECT must be set" >&2
        exit 1
      fi
      if [ -z "${HARBOR_USER}" ] || [ -z "${HARBOR_PASS}" ]; then
        echo "Need HARBOR_USERNAME_DEV/HARBOR_PASSWORD_DEV (group) or HARBOR_USERNAME/HARBOR_PASSWORD" >&2
        exit 1
      fi
    - echo "Building $IMAGE_NAME for linux/$DOCKER_BUILD_ARCH"
    - docker build --build-arg TARGETARCH="$DOCKER_BUILD_ARCH" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:stg"
    - docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "Pushing $HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:stg"
    - docker login -u "$HARBOR_USER" -p "$HARBOR_PASS" "$HARBOR_URL"
    - docker push "$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:stg"
    - docker push "$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  tags:
    - DN2
  only:
    - main
    - staging
